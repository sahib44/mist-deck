server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 3m;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;
  location /api/ { proxy_pass http://api:8000; proxy_set_header Host $host; }
  location /health { proxy_pass http://api:8000; }
  location / { try_files $uri $uri/ /index.html; }
}
